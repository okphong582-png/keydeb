name: Build GloryKey DEB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Theos Environment
        run: |
          echo "Setting up Theos..."
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Set up iOS SDK from Xcode
        run: |
          echo "Linking Xcode iOS SDK..."
          mkdir -p $GITHUB_WORKSPACE/theos/sdks
          ln -s $(xcrun --sdk iphoneos --show-sdk-path) $GITHUB_WORKSPACE/theos/sdks/iPhoneOS.sdk

      - name: Build Tweak
        run: |
          cd tweak
          make clean
          make package FINALPACKAGE=1
          echo "Build completed successfully!"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GloryKey-DEB
          path: tweak/packages/*.deb
